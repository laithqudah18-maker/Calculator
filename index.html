<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="calculator">

    <section class="input">
        <input id="num" type="text">
    </section>

    <section class="btns">
        <button class="number">1</button>
        <button class="number">2</button>
        <button class="number">3</button>
        <button class="number">4</button>
        <button class="number">5</button>
        <button class="number">6</button>
        <button class="number">7</button>
        <button class="number">8</button>
        <button class="number">9</button>
        <button class="number">0</button>
    </section>

    <section class="calculation">
        <button class="output" id="minus">-</button>
        <button class="output" id="divide">/</button>
        <button class="output" id="times">*</button>

        <button class="output" id="equal">=</button>
        <button class="output" id="clear">Clear</button>
        <button class="output" id="plus">+</button>

        <p id="result"></p>
    </section>

</div>

    <script src="calculator.js"></script>
</body>
</html>
